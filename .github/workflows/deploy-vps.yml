name: Deploy to VPS (thediago.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      # No GH_PAGES flag here on purpose: thediago.com is a root domain, not a
      # GitHub Pages project path, so next.config.ts's basePath must stay empty.
      - run: npm run build

      - name: Deploy over rsync/ssh
        env:
          # Non-secret context, safe to print: helps confirm which values the
          # runner actually received if a deploy ever fails again.
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          echo "Host=$VPS_HOST User=$VPS_USER Port=$VPS_PORT Path=$VPS_PATH"

          mkdir -p ~/.ssh
          echo "$SSH_KEY" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null && echo "Key file parses OK" || echo "Key file is NOT a valid private key"

          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" -o StrictHostKeyChecking=no -o BatchMode=yes \
            "$VPS_USER@$VPS_HOST" "echo SSH connection OK, whoami=\$(whoami)"

          # --omit-dir-times / --no-perms: the deploy user only has group
          # write access to the docroot itself (owned by the site's primary
          # "diago" user, not by our deploy user), so it can't chmod or
          # backdate the mtime on that one pre-existing top-level folder —
          # only its owner can. Every file and subfolder rsync creates is
          # owned by our deploy user, so this only ever applies to that one
          # directory. File content is unaffected either way.
          rsync -avz --delete --omit-dir-times --no-perms \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=no" \
            out/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
